<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Electromagnetic Wave Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(20, 20, 20, 0.85);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 280px;
            pointer-events: auto;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
        .legend {
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.8;
        }
        .legend-item {
            display: flex;
            align-items: center;
        }
        .color-box {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 10px;
            border-radius: 3px;
        }
        .red { background-color: #ff3333; }
        .blue { background-color: #3377ff; }
        .controls-hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #aaa;
            text-align: center;
        }
    </style>
    
    <!-- Three.js and OrbitControls CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-panel">
        <h2>Wave Parameters</h2>
        
        <div class="control-group">
            <label>
                <span>Wavelength ($\lambda$)</span>
                <span id="lambda-val">6.0</span>
            </label>
            <input type="range" id="wavelength" min="2" max="15" step="0.1" value="6">
        </div>
        
        <div class="control-group">
            <label>
                <span>Wave Speed ($v$)</span>
                <span id="speed-val">4.0</span>
            </label>
            <input type="range" id="speed" min="0" max="15" step="0.1" value="4">
        </div>

        <div class="legend">
            <div class="legend-item">
                <span class="color-box red"></span> Electric Field ($\vec{E}$)
            </div>
            <div class="legend-item">
                <span class="color-box blue"></span> Magnetic Field ($\vec{B}$)
            </div>
        </div>

        <div class="controls-hint">
            Left Click + Drag to rotate<br>
            Scroll to zoom | Right Click to pan
        </div>
    </div>

    <script>
        // --- 1. Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. Camera Controls ---
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.target.set(15, 0, 0); // Look at the middle of the wave
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // --- 3. Reference Axes ---
        // X = Red, Y = Green, Z = Blue (Built-in Three.js colors)
        const axesHelper = new THREE.AxesHelper(30);
        scene.add(axesHelper);

        // Add a subtle grid for the XZ plane to help visualize 3D depth
        const gridHelper = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
        gridHelper.position.set(30, 0, 0);
        scene.add(gridHelper);

        // --- 4. Wave Variables & Data Structures ---
        let wavelength = 6.0;
        let waveSpeed = 4.0;
        let time = 0;
        
        const amplitude = 4.0;
        const waveLengthX = 40;     // How far down the X-axis the wave propagates
        const numArrows = 100;      // Resolution of the vectors
        
        const eVectors = [];
        const bVectors = [];

        // Base axis directions
        const dirY = new THREE.Vector3(0, 1, 0);
        const dirNegY = new THREE.Vector3(0, -1, 0);
        const dirZ = new THREE.Vector3(0, 0, 1);
        const dirNegZ = new THREE.Vector3(0, 0, -1);

        const colorE = 0xff3333; // Red for Electric Field
        const colorB = 0x3377ff; // Blue for Magnetic Field

        // Initialize ArrowHelpers
        for (let i = 0; i <= numArrows; i++) {
            const xPos = (i / numArrows) * waveLengthX;
            const origin = new THREE.Vector3(xPos, 0, 0);

            // Create Electric Field Arrow (Oscillates in Y)
            const eArrow = new THREE.ArrowHelper(dirY, origin, 0.001, colorE, 0.2, 0.15);
            scene.add(eArrow);
            eVectors.push({ arrow: eArrow, x: xPos });

            // Create Magnetic Field Arrow (Oscillates in Z)
            const bArrow = new THREE.ArrowHelper(dirZ, origin, 0.001, colorB, 0.2, 0.15);
            scene.add(bArrow);
            bVectors.push({ arrow: bArrow, x: xPos });
        }

        // --- 5. UI Event Listeners ---
        document.getElementById('wavelength').addEventListener('input', (e) => {
            wavelength = parseFloat(e.target.value);
            document.getElementById('lambda-val').innerText = wavelength.toFixed(1);
        });

        document.getElementById('speed').addEventListener('input', (e) => {
            waveSpeed = parseFloat(e.target.value);
            document.getElementById('speed-val').innerText = waveSpeed.toFixed(1);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 6. Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            time += waveSpeed * delta;

            // Angular wavenumber k = 2π / λ
            const k = (2 * Math.PI) / wavelength;

            for (let i = 0; i <= numArrows; i++) {
                const x = eVectors[i].x;
                
                // Both fields are in phase: sin(kx - ωt)
                const phase = (k * x) - time;
                const magnitude = amplitude * Math.sin(phase);
                
                // Add a tiny offset to length to prevent Three.js zero-length warnings
                const vectorLength = Math.abs(magnitude) + 0.001;
                
                // Scale arrow heads dynamically to match vector length cleanly
                const headLength = Math.min(0.5, vectorLength * 0.3);
                const headWidth = Math.min(0.3, vectorLength * 0.2);

                // Update E Field ($\vec{E}$)
                const eArrow = eVectors[i].arrow;
                eArrow.setDirection(magnitude >= 0 ? dirY : dirNegY);
                eArrow.setLength(vectorLength, headLength, headWidth);

                // Update B Field ($\vec{B}$)
                const bArrow = bVectors[i].arrow;
                bArrow.setDirection(magnitude >= 0 ? dirZ : dirNegZ);
                bArrow.setLength(vectorLength, headLength, headWidth);
            }

            controls.update(); // Required if damping is enabled
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
