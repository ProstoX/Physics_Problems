<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed of Light in Different Media</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --track-color: #475569;
            --vacuum-color: #fde047;
            --medium-color: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--text-main);
            font-weight: 600;
        }

        canvas {
            display: block;
            margin: 20px auto;
            border-radius: 8px;
            background-color: #0b1121;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 740px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 200px;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background: var(--bg-color);
            border: 1px solid var(--track-color);
            color: var(--text-main);
            font-size: 1rem;
        }
        
        input[type="range"] {
            padding: 0;
            cursor: pointer;
            accent-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: var(--track-color);
            cursor: not-allowed;
            transform: none;
        }

        .formula-display {
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.2rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .math-var {
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Light Race: Speed in Media</h1>
        
        <canvas id="raceCanvas" width="740" height="250"></canvas>

        <div class="controls">
            <div class="control-group">
                <label for="material-select">Select Material:</label>
                <select id="material-select">
                    <option value="1.00">Vacuum / Air (n = 1.00)</option>
                    <option value="1.33">Water (n = 1.33)</option>
                    <option value="1.50">Glass (n = 1.50)</option>
                    <option value="2.42">Diamond (n = 2.42)</option>
                    <option value="custom">Custom...</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="n-slider">Refractive Index (n): <span id="n-val">1.00</span></label>
                <input type="range" id="n-slider" min="1.00" max="4.00" step="0.01" value="1.00">
            </div>

            <button id="start-btn">Start Race</button>
        </div>

        <div class="formula-display" id="formula-output">
            <span class="math-var">v</span> = <span class="math-var">c</span> / <span class="math-var">n</span> = 2.99 &times; 10<sup>8</sup> m/s
        </div>
    </div>

    <script>
        // Constants
        const C = 299792458; // Speed of light in vacuum (m/s)
        const TRACK_START = 40;
        const TRACK_END = 700;
        const TRACK_LENGTH = TRACK_END - TRACK_START;
        const BASE_DURATION_MS = 2000; // 2 seconds for vacuum to cross

        // UI Elements
        const canvas = document.getElementById('raceCanvas');
        const ctx = canvas.getContext('2d');
        const materialSelect = document.getElementById('material-select');
        const nSlider = document.getElementById('n-slider');
        const nValDisplay = document.getElementById('n-val');
        const startBtn = document.getElementById('start-btn');
        const formulaOutput = document.getElementById('formula-output');

        // State variables
        let currentN = 1.00;
        let isRacing = false;
        let startTime = 0;
        let progressVacuum = 0;
        let progressMedium = 0;
        let animationId;

        // Utility format scientific notation
        function formatScientific(number) {
            if (number === 0) return "0.00 &times; 10<sup>0</sup>";
            const exponent = Math.floor(Math.log10(number));
            const mantissa = number / Math.pow(10, exponent);
            return `${mantissa.toFixed(2)} &times; 10<sup>${exponent}</sup>`;
        }

        // Update UI and calculations
        function updateState() {
            currentN = parseFloat(nSlider.value);
            nValDisplay.textContent = currentN.toFixed(2);
            
            // Check if matches preset
            const presets = ["1.00", "1.33", "1.50", "2.42"];
            const match = presets.find(val => Math.abs(parseFloat(val) - currentN) < 0.005);
            if (match) {
                materialSelect.value = match;
            } else {
                materialSelect.value = "custom";
            }

            // Update formula
            const speed = C / currentN;
            formulaOutput.innerHTML = `<span class="math-var">v</span> = <span class="math-var">c</span> / <span class="math-var">n</span> = ${formatScientific(speed)} m/s`;
            
            // Redraw if not currently racing
            if (!isRacing) {
                progressVacuum = 0;
                progressMedium = 0;
                drawScene();
            }
        }

        // Draw the static and animated elements
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Tracks
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // Top Track (Vacuum)
            ctx.beginPath();
            ctx.moveTo(TRACK_START, 70);
            ctx.lineTo(TRACK_END, 70);
            ctx.stroke();

            // Bottom Track (Medium)
            ctx.beginPath();
            ctx.moveTo(TRACK_START, 170);
            ctx.lineTo(TRACK_END, 170);
            ctx.stroke();

            // Labels
            ctx.fillStyle = '#94a3b8';
            ctx.font = '14px "Segoe UI", sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Vacuum (n = 1.00)', TRACK_START, 50);
            ctx.fillText(`Medium (n = ${currentN.toFixed(2)})`, TRACK_START, 150);

            // Finish Line
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(TRACK_END, 40);
            ctx.lineTo(TRACK_END, 200);
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.textAlign = 'center';
            ctx.fillText('Finish', TRACK_END, 30);

            // Draw Pulses
            drawPulse(TRACK_START + progressVacuum, 70, '#fde047');
            drawPulse(TRACK_START + progressMedium, 170, '#38bdf8');
        }

        function drawPulse(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();

            // Glow effect
            ctx.shadowBlur = 15;
            ctx.shadowColor = color;
            ctx.fillStyle = color;
            ctx.fill();
            
            // Reset shadow to not affect other drawings
            ctx.shadowBlur = 0;
        }

        // Animation Loop
        function animate(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;

            // Speed parameters (pixels per ms)
            const vacuumSpeed = TRACK_LENGTH / BASE_DURATION_MS; 
            const mediumSpeed = vacuumSpeed / currentN;

            progressVacuum = elapsed * vacuumSpeed;
            progressMedium = elapsed * mediumSpeed;

            // Cap at finish line
            if (progressVacuum >= TRACK_LENGTH) progressVacuum = TRACK_LENGTH;
            if (progressMedium >= TRACK_LENGTH) progressMedium = TRACK_LENGTH;

            drawScene();

            // Continue animation if the slowest pulse hasn't finished
            if (progressMedium < TRACK_LENGTH) {
                animationId = requestAnimationFrame(animate);
            } else {
                isRacing = false;
                startBtn.disabled = false;
                startBtn.textContent = "Reset & Race Again";
            }
        }

        function startRace() {
            if (isRacing) return;
            
            cancelAnimationFrame(animationId);
            isRacing = true;
            startTime = 0;
            progressVacuum = 0;
            progressMedium = 0;
            
            startBtn.disabled = true;
            startBtn.textContent = "Racing...";
            
            requestAnimationFrame(animate);
        }

        // Event Listeners
        materialSelect.addEventListener('change', (e) => {
            if (e.target.value !== "custom") {
                nSlider.value = e.target.value;
            }
            updateState();
        });

        nSlider.addEventListener('input', updateState);
        startBtn.addEventListener('click', startRace);

        // Initial setup
        updateState();

    </script>
</body>
</html>
