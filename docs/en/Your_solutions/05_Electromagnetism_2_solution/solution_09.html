<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snell's Law of Refraction</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #2c3e50;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .info-panel {
            margin-top: 25px;
            padding: 15px;
            background-color: #eef2f5;
            border-left: 5px solid #3498db;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            text-align: center;
        }

        .tir-warning {
            color: #e74c3c;
            font-weight: bold;
            border-left-color: #e74c3c;
            background-color: #fdeaea;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Snell's Law Visualization</h1>
        
        <canvas id="simCanvas" width="600" height="400"></canvas>

        <div class="controls">
            <div class="control-group">
                <label for="n1-slider">Index of Medium 1 (n₁): <span id="n1-val">1.00</span></label>
                <input type="range" id="n1-slider" min="1.0" max="3.0" step="0.01" value="1.0">
            </div>
            
            <div class="control-group">
                <label for="n2-slider">Index of Medium 2 (n₂): <span id="n2-val">1.50</span></label>
                <input type="range" id="n2-slider" min="1.0" max="3.0" step="0.01" value="1.5">
            </div>

            <div class="control-group">
                <label for="theta1-slider">Angle of Incidence (θ₁): <span id="theta1-val">30°</span></label>
                <input type="range" id="theta1-slider" min="0" max="90" step="1" value="30">
            </div>
        </div>

        <div class="info-panel" id="calc-display">
            Calculation will appear here.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elements
        const n1Slider = document.getElementById('n1-slider');
        const n2Slider = document.getElementById('n2-slider');
        const theta1Slider = document.getElementById('theta1-slider');
        
        const n1Val = document.getElementById('n1-val');
        const n2Val = document.getElementById('n2-val');
        const theta1Val = document.getElementById('theta1-val');
        const calcDisplay = document.getElementById('calc-display');

        // Simulation State
        let n1 = parseFloat(n1Slider.value);
        let n2 = parseFloat(n2Slider.value);
        let theta1Deg = parseFloat(theta1Slider.value);

        // Utility to convert degrees to radians
        const toRad = (deg) => deg * Math.PI / 180;
        const toDeg = (rad) => rad * 180 / Math.PI;

        function updateSimulation() {
            // Update State from UI
            n1 = parseFloat(n1Slider.value);
            n2 = parseFloat(n2Slider.value);
            theta1Deg = parseFloat(theta1Slider.value);

            // Update Labels
            n1Val.textContent = n1.toFixed(2);
            n2Val.textContent = n2.toFixed(2);
            theta1Val.textContent = theta1Deg + '°';

            // Calculate Theta 2
            const theta1Rad = toRad(theta1Deg);
            const sinTheta2 = (n1 / n2) * Math.sin(theta1Rad);
            
            let isTIR = false;
            let theta2Deg = 0;

            if (sinTheta2 > 1) {
                isTIR = true;
            } else {
                const theta2Rad = Math.asin(sinTheta2);
                theta2Deg = toDeg(theta2Rad);
            }

            // Update Info Panel
            if (isTIR) {
                calcDisplay.className = 'info-panel tir-warning';
                calcDisplay.innerHTML = `
                    n₁sin(θ₁) = n₂sin(θ₂) <br>
                    ${n1.toFixed(2)} × sin(${theta1Deg}°) = ${n2.toFixed(2)} × sin(θ₂) <br>
                    sin(θ₂) = ${sinTheta2.toFixed(3)} > 1 <br>
                    <strong>Total Internal Reflection!</strong>
                `;
            } else {
                calcDisplay.className = 'info-panel';
                calcDisplay.innerHTML = `
                    n₁sin(θ₁) = n₂sin(θ₂) <br>
                    ${n1.toFixed(2)} × sin(${theta1Deg}°) = ${n2.toFixed(2)} × sin(θ₂) <br>
                    θ₂ = <strong>${theta2Deg.toFixed(2)}°</strong>
                `;
            }

            drawScene(theta1Rad, isTIR ? null : toRad(theta2Deg));
        }

        function drawScene(theta1Rad, theta2Rad) {
            const width = canvas.width;
            const height = canvas.height;
            const cx = width / 2;
            const cy = height / 2;
            const rayLength = 300;

            ctx.clearRect(0, 0, width, height);

            // 1. Draw Medium 1 (Top)
            // Shade becomes slightly darker/bluer as refractive index increases
            const color1 = `rgba(135, 206, 235, ${0.1 + (n1 - 1) * 0.2})`; 
            ctx.fillStyle = color1;
            ctx.fillRect(0, 0, width, cy);
            
            ctx.fillStyle = "#333";
            ctx.font = "16px Arial";
            ctx.fillText(`Medium 1 (n₁ = ${n1.toFixed(2)})`, 15, 30);

            // 2. Draw Medium 2 (Bottom)
            const color2 = `rgba(135, 206, 235, ${0.1 + (n2 - 1) * 0.2})`;
            ctx.fillStyle = color2;
            ctx.fillRect(0, cy, width, height / 2);
            
            ctx.fillStyle = "#333";
            ctx.fillText(`Medium 2 (n₂ = ${n2.toFixed(2)})`, 15, cy + 30);

            // Boundary Line
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(width, cy);
            ctx.strokeStyle = "#2c3e50";
            ctx.lineWidth = 2;
            ctx.stroke();

            // 3. Draw Normal Line (Dashed)
            ctx.beginPath();
            ctx.setLineDash([8, 8]);
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, height);
            ctx.strokeStyle = "#7f8c8d";
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.setLineDash([]); // Reset line dash

            // 4. Draw Incident Ray (Top Left to Center)
            // Note: Angle is measured from the normal (y-axis)
            const incX = cx - rayLength * Math.sin(theta1Rad);
            const incY = cy - rayLength * Math.cos(theta1Rad);

            ctx.beginPath();
            ctx.moveTo(incX, incY);
            ctx.lineTo(cx, cy);
            ctx.strokeStyle = "#e74c3c"; // Red ray
            ctx.lineWidth = 3;
            ctx.stroke();

            // 5. Draw Refracted or Reflected Ray
            if (theta2Rad !== null) {
                // Refracted Ray (Center to Bottom Right)
                const refX = cx + rayLength * Math.sin(theta2Rad);
                const refY = cy + rayLength * Math.cos(theta2Rad);

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(refX, refY);
                ctx.strokeStyle = "#c0392b"; // Slightly darker red
                ctx.lineWidth = 3;
                ctx.stroke();
            } else {
                // Total Internal Reflection Ray (Center to Top Right)
                const reflX = cx + rayLength * Math.sin(theta1Rad);
                const reflY = cy - rayLength * Math.cos(theta1Rad);

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(reflX, reflY);
                ctx.strokeStyle = "#e67e22"; // Orange for TIR
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Draw intersection point
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, 2 * Math.PI);
            ctx.fillStyle = "#2c3e50";
            ctx.fill();
        }

        // Event Listeners
        n1Slider.addEventListener('input', updateSimulation);
        n2Slider.addEventListener('input', updateSimulation);
        theta1Slider.addEventListener('input', updateSimulation);

        // Initial Draw
        updateSimulation();
    </script>
</body>
</html>
