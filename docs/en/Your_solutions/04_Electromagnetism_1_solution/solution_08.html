<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorentz Force: 2D Particle Trajectory</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: white;
        }
        canvas {
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid #334155;
            z-index: 10;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: #f8fafc;
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #cbd5e1;
            margin-bottom: 5px;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        select, button {
            width: 100%;
            padding: 8px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            outline: none;
        }
        button:hover, select:hover {
            background: #475569;
        }
        button.fire {
            background: #3b82f6;
            border-color: #2563eb;
            font-weight: bold;
            margin-top: 10px;
        }
        button.fire:hover {
            background: #2563eb;
        }
        #readout {
            margin-top: 15px;
            padding: 10px;
            background: #020617;
            border-radius: 6px;
            font-family: monospace;
            font-size: 1rem;
            color: #10b981;
            text-align: center;
        }
        .legend {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        .legend span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            vertical-align: middle;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="ui-panel">
        <h2>Lorentz Force Controls</h2>
        
        <div class="control-group">
            <label><span>Velocity (v)</span> <span id="v-val">5.0</span></label>
            <input type="range" id="v-slider" min="1" max="10" step="0.1" value="5">
        </div>

        <div class="control-group">
            <label><span>Magnetic Field (B)</span> <span id="b-val">5.0</span></label>
            <input type="range" id="b-slider" min="1" max="10" step="0.1" value="5">
        </div>

        <div class="control-group">
            <label><span>Charge (q)</span></label>
            <select id="q-select">
                <option value="1">Positive (+)</option>
                <option value="-1">Negative (-)</option>
            </select>
        </div>

        <div id="readout">Radius (r): <span id="r-val">...</span></div>

        <button class="fire" id="fire-btn">Fire Particle</button>

        <div class="legend">
            <div><span style="background: #3b82f6;"></span> Velocity Vector (v)</div>
            <div><span style="background: #ef4444;"></span> Force Vector (F)</div>
            <div><span style="background: #eab308; border-radius:50%;"></span> B-Field (Into Screen)</div>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const vSlider = document.getElementById('v-slider');
    const bSlider = document.getElementById('b-slider');
    const qSelect = document.getElementById('q-select');
    const vVal = document.getElementById('v-val');
    const bVal = document.getElementById('b-val');
    const rVal = document.getElementById('r-val');
    const fireBtn = document.getElementById('fire-btn');

    // Simulation State
    let width, height;
    let particle = {
        x: 0,
        y: 0,
        vx: 0,
        vy: 0,
        mass: 1,
        active: false,
        trail: []
    };
    
    // Constants for visual scaling
    const TIME_STEP = 0.15;
    const VISUAL_SCALE = 20;

    function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function resetParticle() {
        particle.x = 0;
        particle.y = height / 2;
        particle.vx = parseFloat(vSlider.value) * 1.5; // Scale base speed for visuals
        particle.vy = 0;
        particle.trail = [];
        particle.active = true;
    }

    function drawArrow(fromX, fromY, toX, toY, color, label) {
        const headlen = 10; 
        const dx = toX - fromX;
        const dy = toY - fromY;
        const angle = Math.atan2(dy, dx);
        
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.strokeStyle = color;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (label) {
            ctx.fillStyle = color;
            ctx.font = '14px sans-serif';
            ctx.fillText(label, toX + 5, toY + 5);
        }
    }

    function drawBField() {
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        const spacing = 50;
        
        for (let x = 0; x < width; x += spacing) {
            for (let y = 0; y < height; y += spacing) {
                // Draw 'X'
                ctx.beginPath();
                ctx.moveTo(x - 5, y - 5);
                ctx.lineTo(x + 5, y + 5);
                ctx.moveTo(x + 5, y - 5);
                ctx.lineTo(x - 5, y + 5);
                ctx.stroke();
            }
        }
    }

    function update() {
        // Read UI
        const v_mag = parseFloat(vSlider.value);
        const B = parseFloat(bSlider.value);
        const q = parseInt(qSelect.value);

        // Update displays
        vVal.innerText = v_mag.toFixed(1);
        bVal.innerText = B.toFixed(1);
        
        // Calculate theoretical radius: r = (m*v)/(q*B). 
        // We use absolute value for display since radius is a distance.
        const radius = (particle.mass * v_mag) / (Math.abs(q) * B);
        rVal.innerText = radius.toFixed(2) + " units";

        if (particle.active) {
            // Save trail
            if (particle.trail.length === 0 || 
                Math.hypot(particle.trail[particle.trail.length-1].x - particle.x, particle.trail[particle.trail.length-1].y - particle.y) > 2) {
                particle.trail.push({x: particle.x, y: particle.y});
            }
            if (particle.trail.length > 500) particle.trail.shift();

            // Adjust velocity vector magnitude to match slider (simulate changing v instantly)
            const currentSpeed = Math.hypot(particle.vx, particle.vy);
            if (currentSpeed > 0) {
                const targetSpeed = v_mag * 1.5; 
                particle.vx = (particle.vx / currentSpeed) * targetSpeed;
                particle.vy = (particle.vy / currentSpeed) * targetSpeed;
            }

            // Magnetic Force calculation: F = q * (v x B)
            // Screen coordinates: +x is right, +y is down.
            // B field is INTO screen (+z).
            // Cross product: (vx, vy, 0) x (0, 0, B) = (vy*B, -vx*B, 0)
            const Fx = q * particle.vy * B;
            const Fy = -q * particle.vx * B;

            // Apply force (Euler-Cromer integration for better circular stability)
            // Accel = F / m (mass is 1)
            particle.vx += (Fx / particle.mass) * TIME_STEP * 0.1;
            particle.vy += (Fy / particle.mass) * TIME_STEP * 0.1;
            
            // Re-normalize velocity to ensure magnetic force does absolutely zero work (no spiral drift)
            const newSpeed = Math.hypot(particle.vx, particle.vy);
            const targetSpeed = v_mag * 1.5;
            particle.vx = (particle.vx / newSpeed) * targetSpeed;
            particle.vy = (particle.vy / newSpeed) * targetSpeed;

            particle.x += particle.vx * TIME_STEP;
            particle.y += particle.vy * TIME_STEP;

            // Check boundaries
            if (particle.x < -50 || particle.x > width + 50 || particle.y < -50 || particle.y > height + 50) {
                particle.active = false;
            }
        }
    }

    function render() {
        ctx.clearRect(0, 0, width, height);
        
        drawBField();

        if (particle.active || particle.trail.length > 0) {
            // Draw Trail
            ctx.beginPath();
            for (let i = 0; i < particle.trail.length; i++) {
                const pt = particle.trail[i];
                if (i === 0) ctx.moveTo(pt.x, pt.y);
                else ctx.lineTo(pt.x, pt.y);
            }
            ctx.strokeStyle = `rgba(255, 255, 255, 0.4)`;
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        if (particle.active) {
            const q = parseInt(qSelect.value);
            const B = parseFloat(bSlider.value);
            
            // Draw Vectors
            const vScale = 10;
            const fScale = 1;
            
            // Velocity Vector (Blue)
            drawArrow(particle.x, particle.y, particle.x + particle.vx * vScale, particle.y + particle.vy * vScale, '#3b82f6', 'v');

            // Force Vector (Red)
            const Fx = q * particle.vy * B;
            const Fy = -q * particle.vx * B;
            drawArrow(particle.x, particle.y, particle.x + Fx * fScale, particle.y + Fy * fScale, '#ef4444', 'F');

            // B-Field tiny label attached to particle (Yellow circle with X)
            const bOffsetX = 15;
            const bOffsetY = -15;
            ctx.beginPath();
            ctx.arc(particle.x + bOffsetX, particle.y + bOffsetY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#eab308';
            ctx.fill();
            ctx.fillStyle = '#000';
            ctx.font = '10px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('x', particle.x + bOffsetX, particle.y + bOffsetY);
            ctx.fillStyle = '#eab308';
            ctx.fillText('B', particle.x + bOffsetX + 14, particle.y + bOffsetY);

            // Draw Particle
            ctx.beginPath();
            ctx.arc(particle.x, particle.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = q > 0 ? '#ec4899' : '#14b8a6'; // Pink for +, Teal for -
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Particle sign
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(q > 0 ? '+' : '-', particle.x, particle.y);
        }
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    // Listeners
    fireBtn.addEventListener('click', resetParticle);
    vSlider.addEventListener('input', () => { if(!particle.active) update(); });
    bSlider.addEventListener('input', () => { if(!particle.active) update(); });
    qSelect.addEventListener('change', () => { if(!particle.active) update(); });

    // Start
    resetParticle();
    loop();

</script>
</body>
</html>
