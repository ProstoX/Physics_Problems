<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1D Electrostatic Equilibrium</title>
<style>
    body { 
        font-family: system-ui, -apple-system, sans-serif; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        background-color: #f9fafb; 
        margin: 0; 
        padding: 2rem; 
        color: #1f2937;
    }
    canvas { 
        background: white; 
        border-radius: 12px; 
        box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        cursor: grab; 
        touch-action: none; 
        margin-top: 1.5rem;
    }
    canvas:active { cursor: grabbing; }
    .readout { 
        margin-top: 2rem; 
        font-size: 1.25rem; 
        background: white; 
        padding: 1.5rem 2.5rem; 
        border-radius: 12px; 
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        text-align: center;
        min-width: 300px;
    }
    .equilibrium { color: #16a34a; font-weight: bold; }
</style>
</head>
<body>

    <h2>Electrostatic Equilibrium Simulator</h2>
    <p>Drag the blue test charge ($q_3$) along the axis to find the equilibrium point.</p>
    
    <canvas id="simCanvas" width="800" height="300"></canvas>
    
    <div class="readout" id="readout">Net Force: <br><strong id="forceText">...</strong></div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const readout = document.getElementById('readout');
    
    const k = 8.987e9; // Coulomb's constant (N m^2 / C^2)
    const q1 = 4; // C
    const q2 = 9; // C
    const q3 = 1; // C
    const d = 2.0; // meters
    
    // Canvas layout mapping
    const margin = 100;
    const lineLength = canvas.width - 2 * margin;
    const yPos = canvas.height / 2;
    
    let testChargeX = 1.2; // Initial position in meters
    let isDragging = false;

    // Helper to draw force vectors
    function drawArrow(fromX, fromY, length, direction, color) {
        if (length < 2) return;
        const toX = fromX + (direction === 'right' ? length : -length);
        const headlen = 10;
        const angle = direction === 'right' ? 0 : Math.PI;
        
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, fromY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), fromY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.moveTo(toX, fromY);
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), fromY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.stroke();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 1. Draw horizontal axis
        ctx.beginPath();
        ctx.moveTo(margin, yPos);
        ctx.lineTo(canvas.width - margin, yPos);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        // 2. Draw fixed charges q1 and q2
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(margin, yPos, 18, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(canvas.width - margin, yPos, 24, 0, Math.PI * 2); ctx.fill(); // Slightly larger to represent +9C
        
        ctx.fillStyle = '#1f2937';
        ctx.font = '16px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('+4 C (0 m)', margin, yPos + 45);
        ctx.fillText('+9 C (2.0 m)', canvas.width - margin, yPos + 50);
        
        // 3. Calculate physics constraints
        const pxX = margin + (testChargeX / d) * lineLength; // Pixel X coordinate
        
        // F = k * q1 * q2 / r^2
        const F1 = (k * q1 * q3) / Math.pow(testChargeX, 2);
        const F2 = (k * q2 * q3) / Math.pow(d - testChargeX, 2);
        const netForce = F1 - F2;
        
        // 4. Draw dynamic force vectors
        // We use a logarithmic scale purely so the arrows stay visible on screen as forces approach infinity
        const scale = 25; 
        const visF1 = Math.max(0, Math.log10(F1) * scale - 200); 
        const visF2 = Math.max(0, Math.log10(F2) * scale - 200);
        
        drawArrow(pxX + 18, yPos, visF1, 'right', '#ef4444');
        drawArrow(pxX - 18, yPos, visF2, 'left', '#ef4444');
        
        // 5. Draw draggable test charge q3
        ctx.fillStyle = '#3b82f6';
        ctx.beginPath(); ctx.arc(pxX, yPos, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'white';
        ctx.font = '12px system-ui';
        ctx.fillText('+1C', pxX, yPos + 4);
        
        // Distance label
        ctx.fillStyle = '#1f2937';
        ctx.font = 'bold 14px system-ui';
        ctx.fillText(`${testChargeX.toFixed(2)} m`, pxX, yPos - 30);
        
        // 6. Update UI Readout
        if (Math.abs(testChargeX - 0.8) < 0.005) {
            readout.innerHTML = `Net Force: <br><span class="equilibrium">0.00 N <br>(Equilibrium Achieved)</span>`;
        } else {
            // Displaying forces pointing right as positive, left as negative
            const direction = netForce > 0 ? "Right" : "Left";
            readout.innerHTML = `Net Force: <br><strong>${Math.abs(netForce).toExponential(3)} N (${direction})</strong>`;
        }
    }

    // Mouse and Touch Interaction Logic
    function getMouseX(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        return clientX - rect.left;
    }

    function handleStart(e) {
        const mx = getMouseX(e);
        const pxX = margin + (testChargeX / d) * lineLength;
        if (Math.abs(mx - pxX) < 40) isDragging = true;
    }

    function handleMove(e) {
        if (!isDragging) return;
        let mx = getMouseX(e);
        
        // Constrain to the axis between the charges (prevent collision / division by zero)
        mx = Math.max(margin + 25, Math.min(canvas.width - margin - 25, mx));
        testChargeX = ((mx - margin) / lineLength) * d;
        
        // Snap mechanism for equilibrium point to ensure exact visual
        if (Math.abs(testChargeX - 0.8) < 0.04) testChargeX = 0.8;
        
        render();
    }

    function handleEnd() { 
        isDragging = false; 
    }

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);
    
    // Touch support for mobile
    canvas.addEventListener('touchstart', handleStart, {passive: true});
    canvas.addEventListener('touchmove', handleMove, {passive: true});
    window.addEventListener('touchend', handleEnd);

    // Initial draw
    render();
</script>
</body>
</html>
