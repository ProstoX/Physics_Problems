<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Simulator: Energy & Momentum</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent-blue: #3498db;
            --accent-red: #e74c3c;
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #7f8c8d;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        header {
            grid-column: 1 / -1;
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary);
            font-size: 1.8rem;
        }

        .canvas-container {
            background-color: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 15px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 4px;
            width: 100%;
            height: auto;
            max-height: 450px;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h2 {
            font-size: 1.2rem;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        #startBtn {
            background-color: #2ecc71;
            color: white;
        }
        
        #startBtn:hover { background-color: #27ae60; }

        #resetBtn {
            background-color: #95a5a6;
            color: white;
        }

        #resetBtn:hover { background-color: #7f8c8d; }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            padding: 5px 0;
            border-bottom: 1px dashed var(--border);
        }

        .data-row:last-child {
            border-bottom: none;
        }

        .val-badge {
            font-family: monospace;
            background-color: #f1f2f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-red { color: var(--accent-red); }
        .badge-blue { color: var(--accent-blue); }
        .badge-purple { color: #8e44ad; }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Conservation of Energy & Momentum</h1>
    </header>

    <div class="canvas-container">
        <canvas id="simCanvas" width="800" height="450"></canvas>
    </div>

    <div class="sidebar">
        <div class="panel">
            <h2>Initial Parameters</h2>
            
            <div class="control-group">
                <label>
                    <span style="color: var(--accent-red);">Mass 1 (m₁)</span>
                    <span id="m1-val">0.5 kg</span>
                </label>
                <input type="range" id="m1-slider" min="0.1" max="5.0" step="0.1" value="0.5">
            </div>

            <div class="control-group">
                <label>
                    <span style="color: var(--accent-blue);">Mass 2 (m₂)</span>
                    <span id="m2-val">1.5 kg</span>
                </label>
                <input type="range" id="m2-slider" min="0.1" max="5.0" step="0.1" value="1.5">
            </div>

            <div class="control-group">
                <label>
                    <span>Ramp Height (h)</span>
                    <span id="h-val">3.0 m</span>
                </label>
                <input type="range" id="h-slider" min="1.0" max="10.0" step="0.1" value="3.0">
            </div>

            <div class="btn-group">
                <button id="startBtn">Start Animation</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>

        <div class="panel">
            <h2>Live Data Dashboard</h2>
            
            <div style="margin-bottom: 15px;">
                <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">Phase 1: Energy (Block 1)</h3>
                <div class="data-row">
                    <span>Potential Energy (PE)</span>
                    <span class="val-badge badge-red" id="data-pe">0.00 J</span>
                </div>
                <div class="data-row">
                    <span>Kinetic Energy (KE)</span>
                    <span class="val-badge badge-red" id="data-ke">0.00 J</span>
                </div>
            </div>

            <div>
                <h3 style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 8px;">Phase 2: Momentum (Collision)</h3>
                <div class="data-row">
                    <span>Impact Velocity (v₁)</span>
                    <span class="val-badge badge-red" id="data-v1">0.00 m/s</span>
                </div>
                <div class="data-row">
                    <span>Shared Velocity (v_f)</span>
                    <span class="val-badge badge-purple" id="data-vf">0.00 m/s</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- Configuration & Constants ---
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const g = 9.81; // Gravity (m/s^2)
    
    // Rendering Scale
    const PIXELS_PER_METER = 30;
    const FLOOR_Y = 400; // Pixel Y-coordinate of the flat track
    const RAMP_START_X = 50; // Pixel X-coordinate where ramp begins
    const RAMP_WIDTH_M = 6.0; // Real-world width of the ramp in meters
    const RAMP_WIDTH_PX = RAMP_WIDTH_M * PIXELS_PER_METER;

    // --- State Variables ---
    let m1 = 0.5;
    let m2 = 1.5;
    let h = 3.0;

    let isRunning = false;
    let animationId = null;
    let lastTime = 0;
    
    // Physics simulation state
    let phase = 0; // 0: Idle, 1: Sliding (Energy), 2: Post-collision (Momentum)
    let x_real = 0; // Block 1 position in meters along X axis from start of ramp
    let currentV = 0; // Current velocity magnitude

    // Pre-calculated target values for dashboard
    let target_v1 = 0;
    let target_vf = 0;

    // --- DOM Elements ---
    const m1Slider = document.getElementById('m1-slider');
    const m2Slider = document.getElementById('m2-slider');
    const hSlider = document.getElementById('h-slider');
    
    const m1Val = document.getElementById('m1-val');
    const m2Val = document.getElementById('m2-val');
    const hVal = document.getElementById('h-val');
    
    const dataPE = document.getElementById('data-pe');
    const dataKE = document.getElementById('data-ke');
    const dataV1 = document.getElementById('data-v1');
    const dataVF = document.getElementById('data-vf');
    
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    // --- Helper Functions ---
    // Parabolic Ramp function: returns Y offset in meters given X in meters
    function getRampHeight(x) {
        if (x >= RAMP_WIDTH_M) return 0;
        // y(x) = h * (1 - x/W)^2
        return h * Math.pow(1 - (x / RAMP_WIDTH_M), 2);
    }

    // Derivative of ramp function (dy/dx)
    function getRampSlope(x) {
        if (x >= RAMP_WIDTH_M) return 0;
        return -2 * h / RAMP_WIDTH_M * (1 - (x / RAMP_WIDTH_M));
    }

    // Convert Real-world (meters) to Canvas (pixels)
    function toPx_X(x_m) {
        return RAMP_START_X + x_m * PIXELS_PER_METER;
    }

    function toPx_Y(y_m) {
        return FLOOR_Y - y_m * PIXELS_PER_METER;
    }

    function getBlockSize(mass) {
        // Base size 20px, scales slightly with mass
        return 20 + mass * 4;
    }

    // --- Core Logic ---
    function updateCalculations() {
        // Theoretical max values based on current sliders
        let maxPE = m1 * g * h;
        target_v1 = Math.sqrt(2 * g * h);
        target_vf = (m1 * target_v1) / (m1 + m2);

        // Update Idle Dashboard
        if (phase === 0) {
            dataPE.innerText = maxPE.toFixed(2) + " J";
            dataKE.innerText = "0.00 J";
            dataV1.innerText = "0.00 m/s";
            dataVF.innerText = "0.00 m/s";
        }
    }

    function readSliders() {
        m1 = parseFloat(m1Slider.value);
        m2 = parseFloat(m2Slider.value);
        h = parseFloat(hSlider.value);
        
        m1Val.innerText = m1.toFixed(1) + " kg";
        m2Val.innerText = m2.toFixed(1) + " kg";
        hVal.innerText = h.toFixed(1) + " m";
        
        updateCalculations();
        draw();
    }

    function resetSimulation() {
        isRunning = false;
        if (animationId) cancelAnimationFrame(animationId);
        phase = 0;
        x_real = 0;
        currentV = 0;
        startBtn.innerText = "Start Animation";
        startBtn.style.backgroundColor = "#2ecc71";
        readSliders(); // Resets and redraws
    }

    function startSimulation() {
        if (isRunning) return;
        isRunning = true;
        
        if (phase === 0) {
            phase = 1;
            // A tiny push to start integration if exactly at top (v=0 implies dx/dt=0)
            x_real = 0.001; 
        }
        
        startBtn.innerText = "Running...";
        startBtn.style.backgroundColor = "#95a5a6";
        
        lastTime = performance.now();
        animationId = requestAnimationFrame(gameLoop);
    }

    // --- Render Engine ---
    function drawTrack() {
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#7f8c8d";
        
        // Start high
        ctx.moveTo(RAMP_START_X, toPx_Y(h));
        
        // Draw Curve
        for (let x = 0; x <= RAMP_WIDTH_M; x += 0.1) {
            ctx.lineTo(toPx_X(x), toPx_Y(getRampHeight(x)));
        }
        
        // Draw Flat section
        ctx.lineTo(800, FLOOR_Y);
        ctx.stroke();

        // Draw track supports/fill
        ctx.lineTo(800, 450);
        ctx.lineTo(0, 450);
        ctx.lineTo(0, toPx_Y(h));
        ctx.fillStyle = "#ecf0f1";
        ctx.fill();
        
        // Track floor highlight
        ctx.beginPath();
        ctx.moveTo(0, FLOOR_Y);
        ctx.lineTo(800, FLOOR_Y);
        ctx.strokeStyle = "#bdc3c7";
        ctx.lineWidth = 1;
        ctx.stroke();
    }

    function drawBlocks() {
        const s1 = getBlockSize(m1);
        const s2 = getBlockSize(m2);

        // Block 1 (Red) - Moving
        let b1_y = getRampHeight(x_real);
        let b1_px_x = toPx_X(x_real);
        let b1_px_y = toPx_Y(b1_y);

        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(b1_px_x - s1/2, b1_px_y - s1, s1, s1);
        ctx.strokeStyle = "#c0392b";
        ctx.strokeRect(b1_px_x - s1/2, b1_px_y - s1, s1, s1);

        // Label Block 1
        ctx.fillStyle = "white";
        ctx.font = "10px Arial";
        ctx.textAlign = "center";
        ctx.fillText("m1", b1_px_x, b1_px_y - s1/2 + 4);

        // Block 2 (Blue) - Target/Merged
        let b2_px_x;
        if (phase < 2) {
            // Resting at start of flat section, perfectly aligned to touch Block 1 upon arrival
            b2_px_x = toPx_X(RAMP_WIDTH_M) + s1/2; 
        } else {
            // Merged and moving together
            b2_px_x = b1_px_x + (s1/2 + s2/2);
        }

        ctx.fillStyle = "#3498db";
        ctx.fillRect(b2_px_x - s2/2, FLOOR_Y - s2, s2, s2);
        ctx.strokeStyle = "#2980b9";
        ctx.strokeRect(b2_px_x - s2/2, FLOOR_Y - s2, s2, s2);

        // Label Block 2
        ctx.fillStyle = "white";
        ctx.fillText("m2", b2_px_x, FLOOR_Y - s2/2 + 4);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTrack();
        drawBlocks();
    }

    // --- Physics Engine ---
    function gameLoop(timestamp) {
        if (!isRunning) return;

        // Calculate Delta Time in seconds (capped at 50ms to prevent glitches if tab is inactive)
        let dt = Math.min((timestamp - lastTime) / 1000, 0.05);
        lastTime = timestamp;

        if (phase === 1) {
            // PHASE 1: Conservation of Energy down the ramp
            let current_y = getRampHeight(x_real);
            
            // v = sqrt(2*g*h_drop)
            let v = Math.sqrt(2 * g * (h - current_y));
            
            // Map speed to horizontal velocity
            let slope = getRampSlope(x_real);
            let vx = v / Math.sqrt(1 + slope * slope);
            
            x_real += vx * dt;

            // Update Dashboards for Phase 1
            let currentPE = m1 * g * current_y;
            let currentKE = 0.5 * m1 * v * v;
            dataPE.innerText = currentPE.toFixed(2) + " J";
            dataKE.innerText = currentKE.toFixed(2) + " J";

            // Collision check
            if (x_real >= RAMP_WIDTH_M) {
                phase = 2;
                x_real = RAMP_WIDTH_M; // Snap exactly to collision point
                currentV = target_vf; // Apply Inelastic Collision Formula
                
                // Finalize Phase 1 dash, Populate Phase 2 dash
                dataPE.innerText = "0.00 J";
                dataKE.innerText = (0.5 * m1 * target_v1 * target_v1).toFixed(2) + " J";
                dataV1.innerText = target_v1.toFixed(2) + " m/s";
                dataVF.innerText = target_vf.toFixed(2) + " m/s";
            }
        } else if (phase === 2) {
            // PHASE 2: Conservation of Momentum on flat surface
            x_real += currentV * dt; // They move together at vf

            // Update KE for combined mass for visual completeness (optional, but requested is just vf)
            
            // Stop animation if it moves off canvas
            if (toPx_X(x_real) > canvas.width + 100) {
                isRunning = false;
                startBtn.innerText = "Finished";
                return;
            }
        }

        draw();
        
        if (isRunning) {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    // --- Event Listeners ---
    m1Slider.addEventListener('input', () => { if(!isRunning) readSliders(); else resetSimulation(); });
    m2Slider.addEventListener('input', () => { if(!isRunning) readSliders(); else resetSimulation(); });
    hSlider.addEventListener('input', () => { if(!isRunning) readSliders(); else resetSimulation(); });
    
    startBtn.addEventListener('click', startSimulation);
    resetBtn.addEventListener('click', resetSimulation);

    // Initialize
    readSliders();
</script>
</body>
</html>
