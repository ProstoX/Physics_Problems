<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projectile Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #080e18;
    --panel:    #0d1726;
    --border:   #1a2e4a;
    --accent:   #00d4ff;
    --accent2:  #ff6b35;
    --green:    #39ff8a;
    --text:     #c8dff0;
    --dim:      #4a6a8a;
    --glow:     0 0 12px rgba(0,212,255,0.45);
    --glow2:    0 0 12px rgba(255,107,53,0.5);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
    gap: 20px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    letter-spacing: 0.25em;
  }
  header .label {
    font-size: 0.72rem;
    color: var(--accent);
    text-transform: uppercase;
    font-family: 'Share Tech Mono', monospace;
    opacity: 0.7;
  }
  header h1 {
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: #e8f4ff;
    line-height: 1;
  }
  header .sub {
    font-size: 0.82rem;
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    margin-top: 4px;
  }

  /* ── Main layout ── */
  .layout {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 16px;
    width: 100%;
    max-width: 1060px;
  }

  /* ── Canvas wrapper ── */
  .canvas-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    position: relative;
    box-shadow: inset 0 0 60px rgba(0,20,50,0.5);
  }
  .canvas-wrap::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 6px;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,212,255,0.04) 0%, transparent 70%);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 4px;
  }

  /* ── Side panel ── */
  .side {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .card-title {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* live readout rows */
  .readout {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .row {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .row-label {
    font-size: 0.6rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-family: 'Share Tech Mono', monospace;
  }
  .row-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.28rem;
    color: var(--green);
    text-shadow: 0 0 10px rgba(57,255,138,0.4);
    transition: color 0.1s;
  }
  .row-unit {
    font-size: 0.7rem;
    color: var(--dim);
    margin-left: 3px;
  }

  /* params */
  .params .p-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 4px 0;
    border-bottom: 1px solid rgba(26,46,74,0.6);
    font-size: 0.82rem;
  }
  .params .p-row:last-child { border-bottom: none; }
  .params .p-key {
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
  }
  .params .p-val {
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.82rem;
  }

  /* results */
  .results .r-row {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(26,46,74,0.6);
  }
  .results .r-row:last-child { border-bottom: none; }
  .results .r-label { font-size: 0.62rem; color: var(--dim); font-family: 'Share Tech Mono', monospace; text-transform: uppercase; letter-spacing: 0.12em; }
  .results .r-val {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1.05rem;
    color: var(--accent2);
    text-shadow: var(--glow2);
    opacity: 0;
    transition: opacity 0.6s;
  }
  .results .r-val.visible { opacity: 1; }

  /* button */
  button#startBtn {
    width: 100%;
    padding: 13px 0;
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 5px;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.88rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, color 0.2s;
    position: relative;
    overflow: hidden;
  }
  button#startBtn:hover {
    background: rgba(0,212,255,0.10);
    box-shadow: var(--glow);
    color: #fff;
  }
  button#startBtn:active { background: rgba(0,212,255,0.18); }
  button#startBtn.running {
    border-color: var(--accent2);
    color: var(--accent2);
  }
  button#startBtn.running:hover {
    background: rgba(255,107,53,0.10);
    box-shadow: var(--glow2);
  }
</style>
</head>
<body>

<header>
  <div class="label">Kinematic Simulation</div>
  <h1>Projectile Motion</h1>
  <div class="sub">v₀ = 100 m/s · θ = 37° · g = 9.8 m/s²</div>
</header>

<div class="layout">
  <!-- Canvas -->
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
  </div>

  <!-- Side Panel -->
  <div class="side">

    <!-- Live Data -->
    <div class="card">
      <div class="card-title">Live Telemetry</div>
      <div class="readout">
        <div class="row">
          <span class="row-label">Time</span>
          <span class="row-val" id="vTime">0.000<span class="row-unit">s</span></span>
        </div>
        <div class="row">
          <span class="row-label">Height</span>
          <span class="row-val" id="vHeight">0.00<span class="row-unit">m</span></span>
        </div>
        <div class="row">
          <span class="row-label">Distance</span>
          <span class="row-val" id="vDist">0.00<span class="row-unit">m</span></span>
        </div>
      </div>
    </div>

    <!-- Parameters -->
    <div class="card params">
      <div class="card-title">Parameters</div>
      <div class="p-row"><span class="p-key">v₀</span><span class="p-val">100 m/s</span></div>
      <div class="p-row"><span class="p-key">θ</span><span class="p-val">37°</span></div>
      <div class="p-row"><span class="p-key">vₓ</span><span class="p-val">79.86 m/s</span></div>
      <div class="p-row"><span class="p-key">vᵧ</span><span class="p-val">60.18 m/s</span></div>
      <div class="p-row"><span class="p-key">g</span><span class="p-val">9.8 m/s²</span></div>
    </div>

    <!-- Results -->
    <div class="card results">
      <div class="card-title">Summary</div>
      <div class="r-row">
        <span class="r-label">Time of Flight</span>
        <span class="r-val" id="rTof">—</span>
      </div>
      <div class="r-row">
        <span class="r-label">Max Height</span>
        <span class="r-val" id="rMaxH">—</span>
      </div>
      <div class="r-row">
        <span class="r-label">Total Range</span>
        <span class="r-val" id="rRange">—</span>
      </div>
    </div>

    <!-- Button -->
    <button id="startBtn">▶ Launch</button>

  </div>
</div>

<script>
(function () {
  // ── Physics constants ──────────────────────────────────────────
  const V0    = 100;
  const DEG   = 37;
  const G     = 9.8;
  const THETA = DEG * Math.PI / 180;
  const VX    = V0 * Math.cos(THETA);
  const VY    = V0 * Math.sin(THETA);
  const TOF   = 2 * VY / G;                      // time of flight
  const HMAX  = (VY * VY) / (2 * G);             // max height
  const RANGE = VX * TOF;                         // total range

  // ── Canvas setup ──────────────────────────────────────────────
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');

  // Physical world bounds with padding
  const PAD_LEFT   = 72;
  const PAD_RIGHT  = 28;
  const PAD_TOP    = 36;
  const PAD_BOTTOM = 52;
  const WORLD_W = RANGE  * 1.06;
  const WORLD_H = HMAX   * 1.22;

  // Canvas resolution (fixed logical pixels, CSS scales it)
  const CW = 820;
  const CH = 380;
  canvas.width  = CW;
  canvas.height = CH;

  // World → canvas coordinate transforms
  const plotW = CW - PAD_LEFT - PAD_RIGHT;
  const plotH = CH - PAD_TOP  - PAD_BOTTOM;
  function wx(x)  { return PAD_LEFT + (x / WORLD_W) * plotW; }
  function wy(y)  { return CH - PAD_BOTTOM - (y / WORLD_H) * plotH; }

  // ── Color palette ─────────────────────────────────────────────
  const C = {
    bg:        '#080e18',
    panel:     '#0d1726',
    grid:      'rgba(26,60,100,0.45)',
    axis:      '#2a4a70',
    axisLabel: '#4a6a8a',
    tickLabel: '#4a7a9a',
    trail:     '#00d4ff',
    trailFade: 'rgba(0,212,255,0)',
    ball:      '#ffffff',
    ballGlow:  'rgba(0,212,255,0.7)',
    apex:      '#ff6b35',
    land:      '#39ff8a',
    resultTxt: '#ff6b35',
    ground:    'rgba(0,212,255,0.08)',
  };

  // ── Animation state ──────────────────────────────────────────
  let animId   = null;
  let t        = 0;
  let trail    = [];   // array of {x,y} world coords
  let done     = false;
  let apexMark = null;
  const DT     = 1 / 60; // ~60fps step in simulation seconds
  const SPEED  = 1.2;    // simulation speed multiplier

  // ── DOM refs ─────────────────────────────────────────────────
  const btn     = document.getElementById('startBtn');
  const vTime   = document.getElementById('vTime');
  const vHeight = document.getElementById('vHeight');
  const vDist   = document.getElementById('vDist');
  const rTof    = document.getElementById('rTof');
  const rMaxH   = document.getElementById('rMaxH');
  const rRange  = document.getElementById('rRange');

  // ── Draw helpers ─────────────────────────────────────────────
  function drawBackground() {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, CW, CH);
    // ground fill
    const groundY = wy(0);
    ctx.fillStyle = C.ground;
    ctx.fillRect(wx(0), groundY, plotW, CH - groundY);
  }

  function drawGrid() {
    ctx.strokeStyle = C.grid;
    ctx.lineWidth   = 0.5;
    // vertical grid lines (X)
    const xStep = 100;
    for (let xv = 0; xv <= WORLD_W; xv += xStep) {
      const px = wx(xv);
      ctx.beginPath(); ctx.moveTo(px, PAD_TOP); ctx.lineTo(px, CH - PAD_BOTTOM); ctx.stroke();
    }
    // horizontal grid lines (Y)
    const yStep = 50;
    for (let yv = 0; yv <= WORLD_H; yv += yStep) {
      const py = wy(yv);
      ctx.beginPath(); ctx.moveTo(PAD_LEFT, py); ctx.lineTo(CW - PAD_RIGHT, py); ctx.stroke();
    }
  }

  function drawAxes() {
    ctx.strokeStyle = C.axis;
    ctx.lineWidth   = 1.5;
    // X axis
    ctx.beginPath(); ctx.moveTo(PAD_LEFT, wy(0)); ctx.lineTo(CW - PAD_RIGHT, wy(0)); ctx.stroke();
    // Y axis
    ctx.beginPath(); ctx.moveTo(wx(0), PAD_TOP); ctx.lineTo(wx(0), CH - PAD_BOTTOM); ctx.stroke();

    ctx.fillStyle  = C.tickLabel;
    ctx.font       = '11px "Share Tech Mono", monospace';
    ctx.textAlign  = 'center';

    // X ticks
    const xStep = 100;
    for (let xv = 0; xv <= RANGE + 1; xv += xStep) {
      const px = wx(xv);
      ctx.strokeStyle = C.axis;
      ctx.lineWidth   = 1;
      ctx.beginPath(); ctx.moveTo(px, wy(0)); ctx.lineTo(px, wy(0) + 5); ctx.stroke();
      ctx.fillText(xv, px, wy(0) + 17);
    }

    // Y ticks
    ctx.textAlign = 'right';
    const yStep = 50;
    for (let yv = 0; yv <= HMAX + 10; yv += yStep) {
      const py = wy(yv);
      ctx.strokeStyle = C.axis;
      ctx.lineWidth   = 1;
      ctx.beginPath(); ctx.moveTo(wx(0), py); ctx.lineTo(wx(0) - 5, py); ctx.stroke();
      ctx.fillText(yv, wx(0) - 8, py + 4);
    }

    // Axis labels
    ctx.fillStyle  = C.axisLabel;
    ctx.font       = '12px "Rajdhani", sans-serif';
    ctx.textAlign  = 'center';
    ctx.fillText('Distance (m)', wx(RANGE / 2), CH - 8);
    ctx.save();
    ctx.translate(13, wy(HMAX / 2));
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Height (m)', 0, 0);
    ctx.restore();
  }

  function drawTrail() {
    if (trail.length < 2) return;
    // Glowing gradient trail
    for (let i = 1; i < trail.length; i++) {
      const alpha = i / trail.length;
      ctx.strokeStyle = `rgba(0,212,255,${alpha * 0.85})`;
      ctx.lineWidth   = 1.5 + alpha * 1.2;
      ctx.shadowColor = C.ballGlow;
      ctx.shadowBlur  = 4 * alpha;
      ctx.beginPath();
      ctx.moveTo(wx(trail[i-1].x), wy(trail[i-1].y));
      ctx.lineTo(wx(trail[i].x),   wy(trail[i].y));
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  function drawBall(x, y) {
    const px = wx(x), py = wy(y);
    // outer glow
    const grad = ctx.createRadialGradient(px, py, 0, px, py, 14);
    grad.addColorStop(0,   'rgba(0,212,255,0.35)');
    grad.addColorStop(1,   'rgba(0,212,255,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(px, py, 14, 0, Math.PI*2); ctx.fill();
    // core
    ctx.shadowColor = C.ballGlow;
    ctx.shadowBlur  = 10;
    ctx.fillStyle   = C.ball;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur  = 0;
  }

  function drawApex() {
    if (!apexMark) return;
    const px = wx(apexMark.x), py = wy(apexMark.y);
    // dashed horizontal line
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(255,107,53,0.4)';
    ctx.lineWidth   = 1;
    ctx.beginPath(); ctx.moveTo(wx(0), py); ctx.lineTo(px, py); ctx.stroke();
    ctx.setLineDash([]);
    // marker dot
    ctx.fillStyle = C.apex;
    ctx.shadowColor = 'rgba(255,107,53,0.8)';
    ctx.shadowBlur  = 8;
    ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur  = 0;
    // label
    ctx.fillStyle  = C.apex;
    ctx.font       = '10px "Share Tech Mono", monospace';
    ctx.textAlign  = 'left';
    ctx.fillText(`▲ ${HMAX.toFixed(1)}m`, px + 7, py + 4);
  }

  function drawLandingMarker(x) {
    const px = wx(x);
    const groundY = wy(0);
    ctx.strokeStyle = C.land;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = 'rgba(57,255,138,0.6)';
    ctx.shadowBlur  = 8;
    const tickH = 10;
    ctx.beginPath(); ctx.moveTo(px - 6, groundY); ctx.lineTo(px + 6, groundY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px, groundY); ctx.lineTo(px, groundY + tickH); ctx.stroke();
    ctx.shadowBlur  = 0;
    ctx.fillStyle   = C.land;
    ctx.font        = '10px "Share Tech Mono", monospace';
    ctx.textAlign   = 'center';
    ctx.fillText(`${x.toFixed(0)}m`, px, groundY + 24);
  }

  function drawFinalStats() {
    const cx = CW / 2 + 20;
    const cy = PAD_TOP + 18;
    // subtle backdrop
    ctx.fillStyle = 'rgba(8,14,24,0.78)';
    roundRect(ctx, cx - 10, cy - 16, 200, 52, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,107,53,0.3)';
    ctx.lineWidth   = 1;
    roundRect(ctx, cx - 10, cy - 16, 200, 52, 5);
    ctx.stroke();

    ctx.font      = '10px "Share Tech Mono", monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,107,53,0.6)';
    ctx.fillText('MISSION COMPLETE', cx, cy);

    ctx.fillStyle = C.resultTxt;
    ctx.font      = '11px "Share Tech Mono", monospace';
    ctx.fillText(
      `T: ${TOF.toFixed(2)}s   H: ${HMAX.toFixed(1)}m   R: ${RANGE.toFixed(1)}m`,
      cx, cy + 20
    );
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.arcTo(x+w, y, x+w, y+r, r);
    ctx.lineTo(x+w, y+h-r);
    ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
    ctx.lineTo(x+r, y+h);
    ctx.arcTo(x, y+h, x, y+h-r, r);
    ctx.lineTo(x, y+r);
    ctx.arcTo(x, y, x+r, y, r);
    ctx.closePath();
  }

  function render(curT) {
    const x = VX * curT;
    const y = VY * curT - 0.5 * G * curT * curT;
    drawBackground();
    drawGrid();
    drawAxes();
    if (done) drawLandingMarker(RANGE);
    drawTrail();
    drawApex();
    if (!done) drawBall(x, Math.max(0, y));
    if (done) drawFinalStats();
  }

  function updateHUD(x, y, curT) {
    vTime.innerHTML   = `${curT.toFixed(3)}<span class="row-unit">s</span>`;
    vHeight.innerHTML = `${Math.max(0, y).toFixed(2)}<span class="row-unit">m</span>`;
    vDist.innerHTML   = `${x.toFixed(2)}<span class="row-unit">m</span>`;
  }

  function showResults() {
    rTof.textContent  = `${TOF.toFixed(3)} s`;
    rMaxH.textContent = `${HMAX.toFixed(2)} m`;
    rRange.textContent = `${RANGE.toFixed(2)} m`;
    [rTof, rMaxH, rRange].forEach(el => el.classList.add('visible'));
  }

  // ── Animation loop ──────────────────────────────────────────
  function step() {
    t += DT * SPEED;

    const x = VX * t;
    const y = VY * t - 0.5 * G * t * t;

    // Record apex
    if (!apexMark && t >= TOF / 2) {
      const tApex = VY / G;
      apexMark = { x: VX * tApex, y: HMAX };
    }

    trail.push({ x, y: Math.max(0, y) });

    // Clamp after landing
    if (t >= TOF) {
      t = TOF;
      done = true;
      trail.push({ x: RANGE, y: 0 });
      render(t);
      updateHUD(RANGE, 0, t);
      showResults();
      btn.textContent = '↺ Reset';
      btn.classList.remove('running');
      cancelAnimationFrame(animId);
      return;
    }

    render(t);
    updateHUD(x, y, t);
    animId = requestAnimationFrame(step);
  }

  // ── Button logic ────────────────────────────────────────────
  btn.addEventListener('click', () => {
    cancelAnimationFrame(animId);
    t = 0; trail = []; done = false; apexMark = null;
    [rTof, rMaxH, rRange].forEach(el => el.classList.remove('visible'));
    [rTof, rMaxH, rRange].forEach(el => el.textContent = '—');
    btn.textContent = '■ Running';
    btn.classList.add('running');
    animId = requestAnimationFrame(step);
  });

  // ── Initial static frame ────────────────────────────────────
  render(0);
  updateHUD(0, 0, 0);
})();
</script>
</body>
</html>
