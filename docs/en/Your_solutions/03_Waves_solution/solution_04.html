<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Phase Difference Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0f172a; /* Deep modern dark background */
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #f8fafc;
        }

        .visualization-container {
            position: relative;
            background-color: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        canvas {
            display: block;
            border-radius: 8px;
            background-color: #0b1120; /* Darker canvas background for contrast */
        }

        .overlay-legend {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 8px;
            border-left: 4px solid #38bdf8; /* Cyan accent */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            pointer-events: none; /* Let clicks pass through if needed */
        }

        .overlay-legend h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            font-weight: 600;
            color: #f1f5f9;
        }

        .overlay-legend p {
            margin: 0;
            font-size: 15px;
            color: #cbd5e1;
            font-family: 'Cambria Math', 'Times New Roman', serif;
        }

        .highlight {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="visualization-container">
        <div class="overlay-legend">
            <h3>Phase Difference (<span class="highlight">&Delta;&phi;</span>)</h3>
            <p>&Delta;&phi; = 2&pi;/3 radians (or 120&deg;)</p>
        </div>

        <canvas id="waveCanvas" width="800" height="450"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');

        // Physics & geometry parameters
        const amplitude = 90;
        const wavelength = 300;
        const speed = 0.04;      // Rate of phase change (angular frequency equivalent)
        let phase = 0;           // Current phase angle

        const centerY = canvas.height / 2 - 20; // Shifted slightly up to leave room for the bracket
        const originX = 100;     // Position of the Y-axis

        // Define Points A and B
        // Point B is exactly one-third of a wavelength to the right of Point A
        const xA = originX;
        const xB = originX + (wavelength / 3);

        function draw() {
            // Clear the frame
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Axes (Equilibrium & Y-axis)
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            ctx.beginPath();
            // Horizontal X-axis
            ctx.moveTo(20, centerY);
            ctx.lineTo(canvas.width - 20, centerY);
            // Vertical Y-axis
            ctx.moveTo(originX, 20);
            ctx.lineTo(originX, canvas.height - 80);
            ctx.stroke();

            // Add axis labels
            ctx.fillStyle = '#94a3b8';
            ctx.font = '14px sans-serif';
            ctx.fillText('y', originX - 15, 30);
            ctx.fillText('x', canvas.width - 30, centerY - 10);

            // 2. Draw the continuous sine wave
            ctx.strokeStyle = '#38bdf8'; // Cyan wave
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            for (let x = 20; x < canvas.width - 20; x++) {
                // Wave Equation: y(x,t) = A * sin(kx - wt)
                // We subtract the sin value because canvas Y-coordinates increase downwards
                const k = 2 * Math.PI / wavelength;
                const waveY = centerY - amplitude * Math.sin(k * (x - originX) - phase);
                
                if (x === 20) {
                    ctx.moveTo(x, waveY);
                } else {
                    ctx.lineTo(x, waveY);
                }
            }
            ctx.stroke();

            // 3. Calculate dynamic Y positions for points A and B
            const k = 2 * Math.PI / wavelength;
            const yA = centerY - amplitude * Math.sin(k * (xA - originX) - phase);
            const yB = centerY - amplitude * Math.sin(k * (xB - originX) - phase);

            // 4. Draw Points A and B
            drawPoint(xA, yA, 'A');
            drawPoint(xB, yB, 'B');

            // 5. Draw the dimension bracket below the wave
            drawBracket();

            // Advance time/phase
            phase += speed;

            // Loop animation
            requestAnimationFrame(draw);
        }

        function drawPoint(x, y, label) {
            // Draw outer white border
            ctx.fillStyle = '#f43f5e'; // Bright red/rose
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.arc(x, y, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Draw label slightly offset from the point
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(label, x - 5, y - 15);
        }

        function drawBracket() {
            const bracketY = centerY + amplitude + 50; // Position below the lowest wave trough
            
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            // Main horizontal line
            ctx.moveTo(xA, bracketY);
            ctx.lineTo(xB, bracketY);
            
            // Vertical tick for A
            ctx.moveTo(xA, bracketY - 8);
            ctx.lineTo(xA, bracketY + 8);
            
            // Vertical tick for B
            ctx.moveTo(xB, bracketY - 8);
            ctx.lineTo(xB, bracketY + 8);
            ctx.stroke();

            // Label text in the center of the bracket
            ctx.fillStyle = '#f8fafc';
            ctx.font = 'italic 16px "Cambria Math", serif';
            ctx.textAlign = 'center';
            // Use unicode for lambda (λ)
            ctx.fillText('Distance = λ / 3', (xA + xB) / 2, bracketY + 25);
            
            // Reset text alignment for other renders
            ctx.textAlign = 'left'; 
        }

        // Start the animation loop
        draw();
    </script>
</body>
</html>
